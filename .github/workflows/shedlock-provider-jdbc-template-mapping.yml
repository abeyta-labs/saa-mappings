name: shedlock-provider-jdbc-template-mapping

on:
  # Manual trigger (on-demand)
  workflow_dispatch:
  repository_dispatch:
    types: [shedlock-provider-jdbc-template]
  schedule:
    # Runs based on the configured schedule
    - cron: '0 9 1,15 * *'

permissions:
  contents: write
  pull-requests: write

jobs:
  call-mapping-workflow:
    uses: abeyta-labs/saa-workflows/.github/workflows/create-mapping.yml@main
    with:
      mapping-name: shedlock-provider-jdbc-template
      repo-url: https://github.com/lukas-krecan/ShedLock
      coordinates: net.javacrumbs.shedlock:shedlock-provider-jdbc-template
    secrets: inherit
