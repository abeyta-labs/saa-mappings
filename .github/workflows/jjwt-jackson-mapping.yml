name: jjwt-jackson-mapping

on:
  # Manual trigger (on-demand)
  workflow_dispatch:
  repository_dispatch:
    types: [jjwt-jackson]
  schedule:
    # Runs based on the configured schedule
    - cron: '0 9 1,15 * *'

permissions:
  contents: write
  pull-requests: write

jobs:
  call-mapping-workflow:
    uses: abeyta-labs/saa-workflows/.github/workflows/create-mapping.yml@main
    with:
      mapping-name: jjwt-jackson
      repo-url: https://github.com/jwtk/jjwt
      coordinates: io.jsonwebtoken:jjwt-jackson
    secrets: inherit
